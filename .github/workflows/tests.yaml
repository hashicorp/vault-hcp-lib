name: test

on:
  push:
  workflow_dispatch:
  pull_request:

env:
  ARCHIVE_DIR: /tmp

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4.0.0
      - name: Setup go
        uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          go-version-file: 'go.mod'
      - name: Run Tests
        run: CI=1 /home/runner/go/bin/gotestsum --format=testname -- -cover -timeout=5m -coverprofile=coverage.out ./...